# .sdgqalab/config.yml — Generated by sdgqalab-init on 2026-04-15
# Edit freely. Re-run sdgqalab-init to regenerate from scratch.
version: 3

constitution: .specify/memory/constitution.md

# ════════════════════════════════════════════════════════════════════
# PROJECT METADATA
# ════════════════════════════════════════════════════════════════════

project:
  name: "Stakeholder Analysis Tool"
  type: "web-app"                  # full-stack with AI/ML backend
  deployment_target: "docker"      # docker-compose (4 services)
  compliance: []                   # no explicit compliance requirements detected

# ════════════════════════════════════════════════════════════════════
# STACK LAYERS
# ════════════════════════════════════════════════════════════════════

layers:

  # ── Next.js / React frontend ─────────────────────────────────────
  frontend:
    type: nextjs-typescript
    root: frontend/
    tech_tags:
      - nextjs
      - react
      - typescript
      - tailwindcss
      - d3
      - axios
      - jest
      - any_web_framework

    services: []                   # no separate infra service; proxied via Next.js dev/build

    # — QA audit settings —
    # Active domains: security, reliability, performance-efficiency,
    #   maintainability, flexibility, observability, interaction-capability,
    #   compatibility
    # Inactive: safety (no AI/ML in frontend), data-quality (no DB)
    # documentation: project-wide (audited once, not per-layer)
    quality_attribute_overrides:
      include: []
      exclude: []

    # — Coverage audit settings —
    scopes:
      - src/components
      - src/pages
      - src/lib

    test_command: >-
      cd frontend && npm test -- --watchAll=false --ci

    coverage_command: >-
      cd frontend && npm test -- --watchAll=false --ci --coverage

    source_patterns:
      - "**/*.ts"
      - "**/*.tsx"

    test_patterns:
      - "**/__tests__/**/*.ts"
      - "**/__tests__/**/*.tsx"
      - "**/*.test.ts"
      - "**/*.test.tsx"

    ignore:
      - "**/node_modules/**"
      - "**/.next/**"
      - "**/*.d.ts"
      - "**/types/**"
      - "**/types.ts"
      - "**/setupTests.*"
      - "**/jest.setup.*"
      - "**/react-app-env*"
      - "**/__tests__/fixtures/**"
      - "**/public/**"
      - "**/.swc/**"

  # ── Django backend + AI/ML pipeline ─────────────────────────────
  # All Django apps live in the repo root; the AI pipeline (ingestion,
  # ner, reasoning) is embedded in the same codebase — not a separate
  # service. Combined into one layer for the audit.
  backend:
    type: python-django-ml
    root: .
    tech_tags:
      - python
      - django
      - djangorestframework
      - postgresql
      - pgvector
      - redis
      - celery
      - gunicorn
      - sentence-transformers
      - groq
      - openai
      - google-generativeai
      - spacy
      - numpy
      - rapidfuzz
      - pypdf
      - python-docx
      - reportlab
      - any_api
      - any_database
      - any_ai_ml

    services:
      - postgresql
      - redis
      - celery

    # — QA audit settings —
    # Active domains: ALL 11 (security, reliability, performance-efficiency,
    #   maintainability, flexibility, observability, interaction-capability,
    #   compatibility, safety, data-quality, documentation)
    quality_attribute_overrides:
      include: []
      exclude: []

    # — Coverage audit settings —
    # Django apps discovered: ingestion, ner, reasoning, graph, models
    # Heavy test coverage found in ingestion/ and ner/
    scopes:
      - ingestion
      - ner
      - reasoning
      - graph
      - models
      - stakeholder_analysis

    test_command: >-
      docker compose exec -T app python -m pytest

    # Note: requires pytest-cov — add to requirements.txt if missing:
    #   pytest-cov==5.0.0
    coverage_command: >-
      docker compose exec -T app python -m pytest --cov=. --cov-report=term-missing --cov-config=setup.cfg

    source_patterns:
      - "**/*.py"

    test_patterns:
      - "**/tests/test_*.py"
      - "**/test_*.py"
      - "**/tests.py"

    ignore:
      - "**/migrations/**"
      - "**/__pycache__/**"
      - "**/__init__.py"
      - "**/manage.py"
      - "**/*settings*.py"
      - "**/wsgi.py"
      - "**/asgi.py"
      - "**/apps.py"
      - "**/urls.py"
      - "**/admin.py"
      - "**/conftest.py"
      - "**/.venv/**"
      - "**/node_modules/**"
      - "**/frontend/**"
      - "**/static/**"
      - "**/scripts/**"

# ════════════════════════════════════════════════════════════════════
# SEVERITY OVERRIDES (optional)
# ════════════════════════════════════════════════════════════════════

severity_overrides: {}

# ════════════════════════════════════════════════════════════════════
# EXCLUDED CHECKS (optional)
# ════════════════════════════════════════════════════════════════════

excluded_checks: []
