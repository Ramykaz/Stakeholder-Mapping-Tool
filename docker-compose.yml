services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    depends_on:
      - app

volumes:
  models:

# ─────────────────────────────────────────────────────────────────────────────
# One-time model download (run before first `docker compose up`):
#
#   docker compose run --rm app python -c "\
#     from sentence_transformers import SentenceTransformer; \
#     SentenceTransformer('all-MiniLM-L6-v2').save('/app/models/all-MiniLM-L6-v2')"
#
# This saves ~90 MB to the 'models' Docker volume. Subsequent starts load
# from the volume — no network access required.
# ─────────────────────────────────────────────────────────────────────────────
