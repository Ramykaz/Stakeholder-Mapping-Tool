services:

  # ── Reverse proxy with gzip and rate limiting ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ── Redis (password-protected) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ── Django backend ─────────────────────────────────────────────────────────
  app:
    build: .
    # No host-exposed ports — nginx is the only entry point.
    env_file:
      - .env
    environment:
      GUNICORN_WORKERS: 3
      GUNICORN_THREADS: 2
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ── Celery worker ──────────────────────────────────────────────────────────
  worker:
    build: .
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    entrypoint: ["celery", "-A", "stakeholder_analysis", "worker", "--loglevel=INFO", "--pool=solo", "--concurrency=1"]
    depends_on:
      - redis
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    # No host-exposed ports — nginx proxies all traffic.
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""  # Empty so browser calls go to same origin via nginx
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars beyond .env.example:
#   REDIS_PASSWORD  — a strong random password for Redis
# ─────────────────────────────────────────────────────────────────────────────
