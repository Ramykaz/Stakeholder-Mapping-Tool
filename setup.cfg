[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    .eggs,
    build,
    dist
per-file-ignores =
    # Allow unused imports in __init__.py files
    __init__.py: F401

[tool:pytest]
DJANGO_SETTINGS_MODULE = stakeholder_analysis.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
