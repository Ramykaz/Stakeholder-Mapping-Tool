services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GUNICORN_WORKERS: 2
      GUNICORN_THREADS: 2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    build: .
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    entrypoint: ["celery", "-A", "stakeholder_analysis", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      - redis
      - app
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    restart: unless-stopped
    depends_on:
      - app

# ─────────────────────────────────────────────────────────────────────────────
# The embedding model is baked into the Docker image at build time.
# No separate download step or volume mount is needed.
# ─────────────────────────────────────────────────────────────────────────────
