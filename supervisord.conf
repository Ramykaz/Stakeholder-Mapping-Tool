[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:django]
command=bash -c "python /app/manage.py collectstatic --noinput 2>/dev/null; python /app/manage.py migrate --noinput; gunicorn stakeholder_analysis.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 900"
directory=/app
autostart=true
autorestart=true
priority=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A stakeholder_analysis worker --loglevel=INFO --pool=solo --concurrency=1
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
